### model
model_name_or_path: /dockerdata/ozpintang/llm_models/Qwen3.5-27B
trust_remote_code: true

### method
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_target: all
lora_rank: 16
deepspeed: examples/deepspeed/ds_z3_config.json

### logging
run_name: Qwen3.5-27B_key-node-cot30-direct70_lora_sft

### dataset
dataset: key_node_cot30_direct70_8k
template: qwen3_5
enable_thinking: true
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/Qwen3.5-27B/lora/cot30_direct70_sft_20260723_1116
logging_steps: 1
plot_loss: true
overwrite_output_dir: true
save_steps: 200
save_total_limit: 3
report_to: wandb

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
max_grad_norm: 1.0
flash_attn: sdpa
use_unsloth_gc: true
enable_liger_kernel: false
ddp_find_unused_parameters: false
packing: false

### eval
val_size: 1000
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
